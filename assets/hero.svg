      <circle r="157" fill="none" stroke="#2C6C84" stroke-width="1.3" stroke-dasharray="2 10" opacity=".72"/>
      <circle r="115" fill="none" stroke="#356C84" stroke-width="1.3" opacity=".56"/>
      <circle r="74" fill="#0E2332" stroke="#56D9D3" stroke-opacity=".65" stroke-width="2"/>
      <circle r="53" fill="#103342" stroke="#4FA7BB" stroke-opacity=".58"/>
      <path d="M -13 -8 H 12 L 23 0 L 12 9 H -13 L -23 0 Z" fill="none" stroke="url(#accent)" stroke-width="4" stroke-linejoin="round"/>
      <path d="M -12 -8 V 9 M 12 -8 V 9" fill="none" stroke="#70E8D8" stroke-width="3"/>
      <circle cx="-117" cy="0" r="6" fill="#6DE8D5"/>
      <circle cx="117" cy="0" r="6" fill="#77B9FF"/>
      <circle cx="0" cy="-115" r="6" fill="#7DDAFF"/>
      <circle cx="0" cy="115" r="6" fill="#938FFF"/>
      <circle cx="-109" cy="-111" r="4" fill="#7CD8DF"/>
      <circle cx="127" cy="-92" r="4" fill="#7CD8DF"/>
      <circle cx="138" cy="100" r="4" fill="#7CD8DF"/>
      <path d="M -117 0 L -74 0 M 74 0 L 117 0 M 0 -115 L 0 -74 M 0 74 L 0 115" stroke="#60BEBB" stroke-width="2" opacity=".7"/>
      <path d="M -109 -111 Q -68 -101 -53 -52 M 127 -92 Q 90 -75 57 -47 M 138 100 Q 87 94 53 49" stroke="#4A7C98" stroke-width="1.5" fill="none" stroke-dasharray="4 6"/>
    </g>
    <g font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.8">
      <text x="820" y="41" fill="#6DCECC">SECURITY</text>
      <text x="1182" y="102" fill="#7AADEC">DATA</text>
      <text x="1165" y="301" fill="#9D97F9">SYSTEMS</text>
