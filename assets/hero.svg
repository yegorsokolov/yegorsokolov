<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="350" viewBox="0 0 1280 350" role="img" aria-labelledby="title desc">
  <title id="title">Yegor Sokolov — Software engineering, automation and security</title>
  <desc id="desc">Dark technical banner with connected nodes and modern typography.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0C1422"/>
      <stop offset=".58" stop-color="#111B2D"/>
      <stop offset="1" stop-color="#08131D"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#64F4D6"/>
      <stop offset=".58" stop-color="#5CACFF"/>
      <stop offset="1" stop-color="#8D86FF"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#2C9DAB" stop-opacity=".25"/>
      <stop offset="1" stop-color="#2C9DAB" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse">
      <path d="M 38 0 L 0 0 0 38" fill="none" stroke="#2D3D4E" stroke-opacity=".31" stroke-width="1"/>
    </pattern>
    <clipPath id="rounded"><rect x="0" y="0" width="1280" height="350" rx="20"/></clipPath>
  </defs>
  <g clip-path="url(#rounded)">
    <rect width="1280" height="350" fill="url(#bg)"/>
    <rect width="1280" height="350" fill="url(#grid)"/>
    <circle cx="1048" cy="170" r="310" fill="url(#halo)"/>
    <path d="M 0 348 H 1280" stroke="url(#accent)" stroke-width="5"/>

    <rect x="68" y="49" width="309" height="35" rx="17.5" fill="#122A36" stroke="#2D5764"/>
    <circle cx="87" cy="66.5" r="4.7" fill="#66E5CC"/>
    <text x="103" y="71.8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.35" fill="#96E7DB">ENGINEERING  /  SECURITY  /  AI</text>

    <text x="64" y="178" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" letter-spacing="-3.3" font-size="77" fill="#F3F7FB">Yegor Sokolov</text>
    <text x="70" y="225" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="500" fill="#B8CAD8">Software developer <tspan fill="#6CE9D5">•</tspan> Automation engineer <tspan fill="#6CE9D5">•</tspan> Security-minded builder</text>
    <rect x="70" y="261" width="55" height="4" rx="2" fill="url(#accent)"/>
    <text x="70" y="298" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" fill="#88A2B5" letter-spacing=".55">BUILDING RELIABLE SYSTEMS, FROM IDEA TO DEPLOYMENT.</text>

